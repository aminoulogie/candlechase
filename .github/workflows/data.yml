name: Refresh market data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 2 * *' # monthly, 2nd at 04:17 UTC

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    # One small job per market and year: each runner stays under Dukascopy's rate limit.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        instrument: [eurusd, xauusd, nas100]
        year: [2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore months already downloaded
        uses: actions/cache/restore@v4
        with:
          path: data/raw/parts
          key: parts-${{ matrix.instrument }}-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: parts-${{ matrix.instrument }}-${{ matrix.year }}-
      - run: npx tsx scripts/fetch-data.ts ${{ matrix.instrument }} ${{ matrix.year }}
      - name: Save months downloaded (even on failure, so a re-run resumes)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/parts
          key: parts-${{ matrix.instrument }}-${{ matrix.year }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Hand the months on to the build (even if a later month failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.instrument }}-${{ matrix.year }}
          path: data/raw/parts/
          if-no-files-found: ignore
          retention-days: 3

  build:
    needs: fetch
    # Build with whatever months arrived; missing ones are filled in by the next run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: data/raw/parts
          merge-multiple: true
      - name: Merge years
        run: npx tsx scripts/fetch-data.ts --merge
      - name: Find setups and backtest
        run: npm run data:build
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh market data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
